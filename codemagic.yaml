workflows:
  ios-adhoc:
    name: GM Agent (ad-hoc ipa)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        OPENSSL_VERSION: "3.5.0"
    cache:
      cache_paths:
        - $HOME/openssl-cache
        - $HOME/zstd-cache
    scripts:
      # ---- 每个块都以 set -eu 开头：任何命令失败立刻中断，绝不产出空壳包 ----
      - name: 清理
        script: |
          set -eu
          echo "workspace: $(pwd)"
          rm -rf build

      - name: 编译 OpenSSL
        script: |
          set -eu
          sh scripts/build-openssl-ios.sh

      - name: 编译 zstd
        script: |
          set -eu
          sh scripts/build-zstd-ios.sh

      - name: 编译引擎
        script: |
          set -eu
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build
          clang -target arm64-apple-ios15.0 -isysroot "$SDK" -O2 -std=gnu99 \
            -dynamiclib -install_name @rpath/libgm-engine.dylib \
            -Iengine -Ithird_party/openssl/arm64/include \
            -Ithird_party/zstd/arm64/include \
            engine/json.c engine/session.c engine/tool.c engine/sse.c \
            engine/http.c engine/provider.c engine/turn.c engine/runtime.c engine/codex.c engine/subagent.c engine/log.c engine/main.c \
            third_party/openssl/arm64/lib/libssl.a \
            third_party/openssl/arm64/lib/libcrypto.a \
            third_party/zstd/arm64/lib/libzstd.a \
            -framework Security -framework Foundation -lz \
            -o build/libgm-engine.dylib
          test -s build/libgm-engine.dylib
          file build/libgm-engine.dylib | grep -q "Mach-O 64-bit dynamically linked shared library arm64"
          nm -gU build/libgm-engine.dylib | grep -q _gm_engine_main

      - name: 编译 App
        script: |
          set -eu
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          APP=build/GMAgent.app
          mkdir -p "$APP"
          set +e
          clang -target arm64-apple-ios15.0 -isysroot "$SDK" -O2 -fobjc-arc -fblocks \
            -Iapp -Iapp/Core -Iapp/UI -Iapp/Agent \
            app/main.m app/GMAppDelegate.m app/GMLog.m app/Core/*.m app/UI/*.m app/Agent/*.m \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -framework QuartzCore -framework WebKit -framework Security \
            -o "$APP/GMAgent" 2>&1 | tee "$CM_BUILD_DIR/compile-log.txt"
          RC=${PIPESTATUS[0]}
          set -e
          if [ $RC -ne 0 ]; then
            echo "!! 编译失败，最后 40 行："
            tail -40 "$CM_BUILD_DIR/compile-log.txt"
            exit $RC
          fi
          test -s "$APP/GMAgent"

      - name: 组装 Bundle
        script: |
          set -eu
          APP=build/GMAgent.app
          cp "$CM_BUILD_DIR/app/Resources/Info.plist" "$APP/Info.plist"
          cp "$CM_BUILD_DIR/app/Resources/cacert.pem" "$APP/cacert.pem"
          cp -R "$CM_BUILD_DIR/app/Resources/Helpers" "$APP/Helpers"
          chmod +x "$APP/Helpers/"* 2>/dev/null || true
          # 建立 busybox 风格的多调用链接（argv[0] 分发）
          (
            cd "$APP/Helpers"
            for c in cat ls grep sed head tail wc find xargs sort uniq cut tr tee stat du date \
                     uname which readlink realpath mkdir rm rmdir mv cp ln chmod touch od xxd \
                     basename dirname nl tar env true false pwd sleep; do
              ln -sf ca-filetool "$c"
            done
            ln -sf bash.real bash
            ln -sf bash.real sh
            echo "== Helpers 链接数: $(ls -1 | wc -l)"
          )
          cp "$CM_BUILD_DIR/build/libgm-engine.dylib" "$APP/libgm-engine.dylib"
          chmod +x "$APP/GMAgent"
          pwd; ls -la "$APP"
          # 自检：版本号与 Scene 清单必须在（防止再出现"改不动"的包）
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist" | tee /tmp/ver.txt
          V=$(cat /tmp/ver.txt | tr -d ' ')
          test "$V" = "190" || { echo "!! CFBundleVersion 不是 100，说明 plist 没更新"; exit 1; }
          # 自检：可执行文件必须在，且是 arm64
          test -x "$APP/GMAgent"
          test -s "$APP/libgm-engine.dylib"
          file "$APP/GMAgent"
          file "$APP/libgm-engine.dylib"

      - name: 签名
        script: |
          set -eu
          APP=build/GMAgent.app
          ENT=app/Resources/entitlements.plist
          codesign --force --sign - "$APP/libgm-engine.dylib"
          codesign --force --sign - --entitlements "$ENT" --deep "$APP"
          codesign --verify --deep --verbose=2 "$APP" || true
          codesign -dv --verbose=4 "$APP" 2>&1 | head -10 || true
          echo "=== 已注入的 entitlements ==="
          codesign -d --entitlements :- "$APP" 2>/dev/null > /tmp/ent.plist || true
          cat /tmp/ent.plist
          # 自检：必须有 platform-application 与 no-sandbox
          grep -q "platform-application" /tmp/ent.plist || { echo "!! 缺少 platform-application"; exit 1; }
          grep -q "no-sandbox" /tmp/ent.plist || { echo "!! 缺少 no-sandbox"; exit 1; }
          echo "=== entitlements 校验通过 ==="

      - name: 打包 ipa
        script: |
          set -eu
          rm -rf build/pkg
          mkdir -p build/pkg/Payload
          cp -R build/GMAgent.app build/pkg/Payload/
          cd build/pkg
          zip -qry ../GMAgent.ipa Payload
          cd ..
          # 自检：ipa 里必须有主二进制，大小必须合理
          unzip -l GMAgent.ipa | grep -E "Payload/GMAgent.app/(GMAgent|libgm-engine.dylib)$"
          SIZE=$(stat -f%z GMAgent.ipa)
          echo "ipa size: $SIZE"
          MIN=$((1500 * 1024))   # 压缩后正常约 1.8MB；低于 1.5MB 说明缺文件
          if [ "$SIZE" -lt "$MIN" ]; then
            echo "!! ipa 只有 $SIZE 字节，小于 1.5MB，说明根本没有把可执行文件打进去" >&2
            unzip -l GMAgent.ipa >&2
            exit 1
          fi

    artifacts:
      - build/GMAgent.ipa
      - compile-log.txt
